<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mario Runner</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light; font-family: ui-monospace, Menlo, Consolas, monospace; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 16px; color: #334155;
        /* Soft pastel blobs, so the glass panel has something to blur. */
        background:
          radial-gradient(520px 320px at 12% 18%, rgba(167, 139, 250, 0.45), transparent 70%),
          radial-gradient(480px 300px at 88% 22%, rgba(52, 211, 153, 0.4), transparent 70%),
          radial-gradient(560px 340px at 70% 88%, rgba(251, 146, 60, 0.35), transparent 70%),
          radial-gradient(520px 320px at 18% 84%, rgba(56, 189, 248, 0.4), transparent 70%),
          #eef2f7;
      }
      /* 840 × 370 glass panel: the size the built-in HUD is tuned for. */
      .glass {
        width: min(100%, 840px); height: 330px; border-radius: 20px; overflow: hidden; position: relative;
        background: rgba(100, 112, 135, 0.34);
        backdrop-filter: blur(16px) saturate(1.3);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 24px 60px rgba(30, 41, 59, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      @media (min-width: 640px) { .glass { height: 370px; } }
      #stage { position: absolute; inset: 0; cursor: pointer; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; }
      select { font: inherit; background: rgba(255, 255, 255, 0.7); color: inherit; border: 1px solid rgba(100, 116, 139, 0.4); border-radius: 6px; padding: 3px 8px; }
      footer { font-size: 11px; opacity: 0.7; text-align: center; }
      footer a { color: #b45309; }
    </style>
  </head>
  <body>
    <div class="glass"><div id="stage"></div></div>
    <div class="bar">
      <label>Theme
        <select id="theme">
          <option value="glass" selected>glass</option>
          <option value="day">day</option>
          <option value="dusk">dusk</option>
          <option value="night">night</option>
          <option value="underground">underground</option>
        </select>
      </label>
      <label><input id="scenery" type="checkbox" checked /> parallax</label>
    </div>
    <footer>Click the mouse or press Space to jump &nbsp;|&nbsp; <a href="https://github.com/sonth87" target="_blank" rel="noopener noreferrer">SONTH87</a></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
